<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Katar Café · Шашлык на углях · Меню и заказ</title>
  <meta name="description" content="Меню Katar Café в Грозном, ул. Мира, 46. Курица на углях, люля, шашлык, плов, манты. Заказ и доставка через WhatsApp.">
  <meta name="theme-color" content="#0e0c0b">
  <link rel="canonical" href="https://xasi88.github.io/timuri_dottax/">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Katar Café">
  <meta property="og:title" content="Katar Café · Шашлык на углях">
  <meta property="og:description" content="Курица, мясо, люля на углях. Меню и заказ в WhatsApp. Доставка по Грозному.">
  <meta property="og:url" content="https://xasi88.github.io/timuri_dottax/">
  <meta property="og:image" content="https://xasi88.github.io/timuri_dottax/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Katar Café. Шашлык на углях. Меню и заказ в WhatsApp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://xasi88.github.io/timuri_dottax/img/og.jpg">

  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Katar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-in">
      <a class="brand" href="#menu" aria-label="Katar, меню">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text"><b>Katar</b><small>Шашлык на углях</small></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Разделы приложения"></nav>
      <span class="status" id="status"></span>
    </div>
  </header>

  <main class="app">
    <section class="view" id="view-menu" data-view="menu" aria-label="Меню">
      <div class="menu-layout">
        <div class="menu-main">
          <article class="promo" id="promo"></article>
          <nav class="chips" id="chips" aria-label="Разделы меню"><div class="chips-track" id="chipsTrack"><span class="chips-pill" id="chipsPill"></span></div></nav>
          <div id="groups"></div>
          <p class="demo-note" id="demoNote" hidden>Бета-версия. Фото из Instagram кафе. Цены примерные, уточняйте при заказе.</p>
        </div>
        <aside class="side-order" id="sideOrder" aria-label="Ваш заказ"></aside>
      </div>
    </section>

    <section class="view" id="view-search" data-view="search" aria-label="Поиск" hidden>
      <div class="page">
        <h1 class="page-title">Поиск</h1>
        <label class="searchbox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Курица, плов, чай…" autocomplete="off" enterkeyhint="search" aria-label="Найти блюдо">
          <button type="button" class="clear" id="qClear" aria-label="Очистить" hidden>×</button>
        </label>
        <div class="quick" id="quick"></div>
        <div class="results" id="results"></div>
      </div>
    </section>

    <section class="view" id="view-order" data-view="order" aria-label="Заказ" hidden>
      <div class="page" id="orderPage"></div>
    </section>

    <section class="view" id="view-cafe" data-view="cafe" aria-label="О кафе" hidden>
      <div class="page" id="cafePage"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Разделы приложения"></nav>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-bg" data-close></div>
    <article class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dName" tabindex="-1">
      <button class="sheet-x" type="button" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="d-art" id="dArt"></div>
      <div class="d-body">
        <p class="d-meta" id="dMeta"></p>
        <h2 class="d-name" id="dName"></h2>
        <p class="d-desc" id="dDesc"></p>
        <div class="d-buy"><b class="d-price" id="dPrice"></b><div id="dCtl"></div></div>
      </div>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <span class="flyer" id="flyer" aria-hidden="true"></span>

  <script src="data/menu.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/order.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
